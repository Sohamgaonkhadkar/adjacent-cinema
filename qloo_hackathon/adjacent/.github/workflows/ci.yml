name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qloo_hackathon/adjacent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic uvicorn pytest ruff
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Tests (no API key, fixture-backed)
        env:
          QLOO_API_KEY: ""
        run: python -m pytest
      - name: Probe (dry-run — must never require a key)
        run: python scripts/qloo_probe.py
      - name: Fail if the dry-run probe files were not produced
        run: |
          test -f docs/API_NOTES.md
          test -f docs/api_probe_results.json
