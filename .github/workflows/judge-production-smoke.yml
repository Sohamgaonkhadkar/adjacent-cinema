name: Judge production smoke

# Narrow opt-in audit, with one push trigger to verify the first script release.
# Subsequent runs should be initiated manually, not on every normal push.
on:
  push:
    branches:
      - release/judge-smoke-20261102
    paths:
      - .github/workflows/judge-production-smoke.yml
      - qloo_hackathon/adjacent/scripts/judge-production-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: qloo_hackathon/adjacent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check real public site and one labelled fixture
        run: node scripts/judge-production-smoke.mjs --fixture
      - name: Verify new judge links on deployed homepage
        run: |
          node --input-type=module - <<'JS'
          const url = "https://adjacent-cinema.vercel.app/";
          const response = await fetch(url, { headers: { "cache-control": "no-cache" } });
          const html = await response.text();
          if (!response.ok) throw new Error("Home page HTTP " + response.status);
          for (const path of ["/creator?demo=fixture", "/cinema?demo=fixture"]) {
            if (!html.includes('href="' + path + '"')) {
              throw new Error("Deployed home page missing judge shortcut: " + path);
            }
            console.log("PASS deployed judge shortcut: " + path);
          }
          JS
      - name: Attach machine-readable smoke status (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-production-smoke
          path: qloo_hackathon/adjacent/judge-production-smoke-report.json
          if-no-files-found: warn
          retention-days: 30
