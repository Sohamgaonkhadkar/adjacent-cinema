name: M14 common-universe live study

# A single push when this workflow is first added, plus explicit manual reruns.
# No general push/PR trigger: Qloo calls spend provider quota.
on:
  push:
    branches:
      - arena/common-universe-qloo-evaluation-20261102
    paths:
      - .github/workflows/m14-common-universe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    if: github.repository == 'Sohamgaonkhadkar/adjacent-cinema'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qloo_hackathon/adjacent
    env:
      QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install declared backend runtime dependencies
        run: python -m pip install "fastapi>=0.115" "httpx>=0.27" "pydantic>=2.7" "uvicorn>=0.30"
      - name: Run once; preserve a blocked/not-evaluable result
        shell: bash
        run: |
          set +e
          python research/scripts/m14_common_universe_live.py \
            --manifest data/benchmarks/common_universe_20261102.json \
            --output m14_common_universe_result.json --live
          rc=$?
          set -e
          echo "M14 research runner exit status: $rc (0=evaluable; 2=blocked or not evaluable)"
          test -s m14_common_universe_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("m14_common_universe_result.json").read_text())
          print("Status:", r["status"])
          print("Reason:", r["reason"])
          print("Frozen catalog:", r["frozen_sha256"])
          print("Scored:", r.get("qloo_coverage", {}).get("scored", 0),
                "/", r["candidate_count"])
          print("Observed outcome verdict:", r["outcome_verdict"])
          PY
      - name: Save evidence status and coverage (no raw provider response)
        uses: actions/upload-artifact@v4
        with:
          name: m14-common-universe-evaluation
          path: qloo_hackathon/adjacent/m14_common_universe_result.json
          if-no-files-found: error
          retention-days: 30
