name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qloo_hackathon/adjacent
    env:
      # Present only when the repository secret is configured; never printed.
      QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies (pinned lint, declared runtime deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx httpx2 pydantic uvicorn pytest "ruff==0.17.0" "mcp>=2,<3"
      - name: Lint gate (ruff, pinned — active production code)
        run: python -m ruff check .
      - name: Legacy lint debt report (research/scripts — informational, non-blocking)
        run: |
          echo "Tracked in docs/LINT_DEBT.md; not a merge gate."
          ruff check $(find research scripts -name '*.py' | sort) --statistics || true
      - name: Offline and fixture-backed tests (live tests run in the dedicated step)
        run: python -m pytest -m "not live" -rs
      - name: Live-Qloo tests (only when QLOO_API_KEY secret is configured)
        if: env.QLOO_API_KEY != ''
        run: python -m pytest -m live -rs
      - name: Verify installed backend package includes API modules
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/adjacent-installed" .
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/adjacent-installed" python -c "import app.main; import app.api.creator_routes; import app.resolution.resolver"
      - name: Probe (dry-run — must never require a key)
        run: python scripts/qloo_probe.py
      - name: Fail if the dry-run probe files were not produced
        run: |
          test -f docs/API_NOTES.md
          test -f docs/api_probe_results.json
      - name: MCP server registry self-test (offline, no key)
        # Proves the optional MCP adapter imports, registers exactly its three
        # read-only tools, and refuses live mode when the operator has not
        # enabled it. No key is read and no provider call is made.
        run: |
          python - <<'PY'
          import asyncio
          from app.mcp_server import analyze_film_positioning, build_server

          tools = sorted(t.name for t in asyncio.run(build_server().list_tools()))
          assert tools == [
              "analyze_film_positioning",
              "compare_film_groups",
              "get_evidence_report",
          ], tools
          live = asyncio.run(
              analyze_film_positioning([{"title": "self-test"}], mode="live")
          )
          assert live["status"] == "unavailable", live
          assert "ADJACENT_MCP_ALLOW_LIVE" in live["reason"], live
          print("mcp registry self-test ok:", tools)
          PY
      - name: Verification-report renderer self-test (offline, no key)
        # Guards the report generator that produces docs/verification/*. The step
        # renders a synthetic report and asserts on it; it never calls Qloo, so a
        # broken renderer cannot hide behind a missing QLOO_API_KEY.
        run: python research/scripts/live_counterfactual_evaluation.py --self-test

  frontend:
    runs-on: ubuntu-latest
    env:
      # Bake an isolated local origin into the production rewrite for the API-proxy smoke test.
      ADJACENT_API_ORIGIN: http://127.0.0.1:43129
    defaults:
      run:
        working-directory: qloo_hackathon/adjacent/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qloo_hackathon/adjacent/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test run recovery
        run: npm run test:recovery
      - name: Test responsive layout
        run: npm run test:layout
      - name: Test Creator failure-stage visibility
        run: npm run test:creator-ui
      - name: Test Cultural Multiverse selection and policy
        run: npm run test:positioning
      - name: Test entity display and fingerprint accessibility
        run: npm run test:entity-display
      - name: Test frontend/backend request contract and idempotency
        run: npm run test:contract
      - name: Test trusted client-IP proxy headers
        run: npm run test:proxy
      - name: Test decision-challenge view model and receipt export
        run: npm run test:challenge
      - name: Test comparables audit view model
        run: npm run test:comparables
      - name: Test bounded explainability panel
        run: npm run test:explainability
      - name: Build frontend
        run: npm run build
      - name: Render primary routes from the production build
        run: npm run test:render

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Render Blueprint YAML
        run: ruby -e 'require "yaml"; YAML.load_file("render.yaml")'
      - name: Validate deployment Compose configuration
        working-directory: qloo_hackathon/adjacent
        run: |
          cp deploy.env.example .env
          docker compose config --quiet
      - name: Build backend container
        run: docker build -f qloo_hackathon/adjacent/backend/Dockerfile -t adjacent-backend:ci qloo_hackathon/adjacent
      - name: Build frontend container
        run: docker build --build-arg ADJACENT_API_ORIGIN=http://backend:8000 -f qloo_hackathon/adjacent/frontend/Dockerfile -t adjacent-frontend:ci qloo_hackathon/adjacent/frontend
